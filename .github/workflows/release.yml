name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Determine release version
        if: github.event_name == 'push'
        run: |
          # next patch version after the latest plain X.Y.Z tag
          last=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          last=${last:-0.0.0}
          IFS=. read -r major minor patch <<< "$last"
          echo "VERSION=${major}.${minor}.$((patch + 1))" >> "$GITHUB_ENV"

      - name: Set project version
        if: github.event_name == 'push'
        run: mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B clean verify

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" target/*-dist.zip \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
